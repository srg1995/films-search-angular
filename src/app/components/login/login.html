@if(isOpen()){

<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
  <div class="bg-white rounded-lg p-6 w-80 relative">
    <button class="absolute top-2 right-2 text-gray-500 hover:text-gray-800">✕</button>
    <h2 class="text-xl font-bold mb-4">Modal</h2>
    <button (click)="login()">Login con Google</button>
    <button
      class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition"
      (click)="loginFacebook()"
    >
      Login con Facebook
    </button>

    <button
      class="bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700 transition"
      (click)="logout()"
    >
      Cerrar sesión
    </button>
  </div>
</div>

}
<div class="flex gap-2 justify-between p-6 bg-blue-50">
  <div>
    @if(!!derivedUser()){
    <h1 class="font-extrabold text-black text-4xl">Bienvenido {{ derivedUser() }}</h1>
    }
  </div>
  <div class="flex gap-2">
    <button
      (click)="toogleModal()"
      class="bg-blue-500 text-white font-semibold px-4 py-2 rounded-xl hover:bg-blue-600 transition-colors duration-300 disabled:opacity-50 cursor-pointer"
    >
      @if(isLoged()){ LogOut }@else { LogIn }
    </button>
    @if(isLoged()){
    <button
      class="bg-blue-500 text-white font-semibold px-4 py-2 rounded-xl hover:bg-blue-600 transition-colors duration-300 disabled:opacity-50 cursor-pointer"
      [routerLink]="['/contact']"
    >
      Contactanos
    </button>
    }
  </div>
</div>
